name: Deploy Readiness Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-responsive:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: dummy-anon-key
      BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start preview server
        run: npm run preview -- --host 127.0.0.1 --port 4173 &

      - name: Wait for preview
        run: |
          for i in {1..30}; do
            curl -sSf http://127.0.0.1:4173 >/dev/null && exit 0
            sleep 2
          done
          echo "Preview server failed to start" >&2
          exit 1

      - name: Responsive smoke check
        run: npm run responsive:check
